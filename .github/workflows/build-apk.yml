name: Build Ionic Android APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build-apk:

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # 1. Get the source code
      # ----------------------------------------------------------
      - name: Checkout project
        uses: actions/checkout@v5


      # ----------------------------------------------------------
      # 2. Install Node.js
      # ----------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'


      # ----------------------------------------------------------
      # 3. Install project dependencies
      # ----------------------------------------------------------
      - name: Install npm dependencies
        run: npm ci


      # ----------------------------------------------------------
      # 4. Recreate .env inside the runner from GitHub secrets.
      # .env itself stays private (gitignored) and is NEVER
      # committed. The secrets are masked by GitHub - nothing is
      # visible in logs.
      # Add these REPOSITORY secrets (scope MUST be "Repository"):
      #   Settings > Secrets and variables > Actions:
      #   FIREBASE_API_KEY, FIREBASE_AUTH_DOMAIN,
      #   FIREBASE_DATABASE_URL, FIREBASE_PROJECT_ID,
      #   FIREBASE_STORAGE_BUCKET, FIREBASE_MESSAGING_SENDER_ID,
      #   FIREBASE_APP_ID
      # ----------------------------------------------------------
      - name: Configure Firebase credentials
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          missing=""
          if [ -z "$FIREBASE_API_KEY" ]; then missing="$missing FIREBASE_API_KEY"; fi
          if [ -z "$FIREBASE_AUTH_DOMAIN" ]; then missing="$missing FIREBASE_AUTH_DOMAIN"; fi
          if [ -z "$FIREBASE_DATABASE_URL" ]; then missing="$missing FIREBASE_DATABASE_URL"; fi
          if [ -z "$FIREBASE_PROJECT_ID" ]; then missing="$missing FIREBASE_PROJECT_ID"; fi
          if [ -z "$FIREBASE_STORAGE_BUCKET" ]; then missing="$missing FIREBASE_STORAGE_BUCKET"; fi
          if [ -z "$FIREBASE_MESSAGING_SENDER_ID" ]; then missing="$missing FIREBASE_MESSAGING_SENDER_ID"; fi
          if [ -z "$FIREBASE_APP_ID" ]; then missing="$missing FIREBASE_APP_ID"; fi
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:${missing}"
            echo "::error::Add them under Settings > Secrets and variables > Actions > New repository secret (scope = Repository)."
            exit 1
          fi
          echo "All 7 FIREBASE_* secrets present - writing real values to .env (kept masked in logs)."
          printf 'VITE_FIREBASE_API_KEY=%s\n' "$FIREBASE_API_KEY" > .env
          printf 'VITE_FIREBASE_AUTH_DOMAIN=%s\n' "$FIREBASE_AUTH_DOMAIN" >> .env
          printf 'VITE_FIREBASE_DATABASE_URL=%s\n' "$FIREBASE_DATABASE_URL" >> .env
          printf 'VITE_FIREBASE_PROJECT_ID=%s\n' "$FIREBASE_PROJECT_ID" >> .env
          printf 'VITE_FIREBASE_STORAGE_BUCKET=%s\n' "$FIREBASE_STORAGE_BUCKET" >> .env
          printf 'VITE_FIREBASE_MESSAGING_SENDER_ID=%s\n' "$FIREBASE_MESSAGING_SENDER_ID" >> .env
          printf 'VITE_FIREBASE_APP_ID=%s\n' "$FIREBASE_APP_ID" >> .env
          echo "Wrote .env"
          if grep -q '^VITE_FIREBASE_DATABASE_URL=https://' .env; then
            echo "Sanity check OK: database URL present."
          else
            echo "::error::Sanity check failed: database URL looks wrong in .env."
            exit 1
          fi


      # ----------------------------------------------------------
      # 5. Build Ionic/Vue application
      # ----------------------------------------------------------
      - name: Build Ionic application
        run: npm run build


      # ----------------------------------------------------------
      # 6. Install Java 21
      # IMPORTANT:
      # Capacitor Android currently compiles with Java 21.
      # ----------------------------------------------------------
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'


      # ----------------------------------------------------------
      # 7. Confirm Java version
      # ----------------------------------------------------------
      - name: Check Java version
        run: |
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"


      # ----------------------------------------------------------
      # 8. Ensure the Android platform exists
      # ----------------------------------------------------------
      - name: Ensure Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi


      # ----------------------------------------------------------
      # 9. Synchronize Capacitor with Android
      # ----------------------------------------------------------
      - name: Sync Capacitor Android
        run: npx cap sync android


      # ----------------------------------------------------------
      # 10. Give Gradle execution permission
      # ----------------------------------------------------------
      - name: Make Gradle executable
        run: chmod +x android/gradlew


      # ----------------------------------------------------------
      # 11. Check Gradle environment
      # ----------------------------------------------------------
      - name: Check Gradle version
        working-directory: android
        run: ./gradlew --version


      # ----------------------------------------------------------
      # 12. Build debug APK
      # ----------------------------------------------------------
      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug


      # ----------------------------------------------------------
      # 13. Rename the generated APK
      # ----------------------------------------------------------
      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk EventPlanner.apk


      # ----------------------------------------------------------
      # 14. Upload APK to GitHub Actions
      # ----------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: EventPlanner-APK
          path: EventPlanner.apk
          if-no-files-found: error
          retention-days: 30