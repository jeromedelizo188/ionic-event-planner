name: Build Ionic Android APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build-apk:

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # 1. Get the source code
      # ----------------------------------------------------------
      - name: Checkout project
        uses: actions/checkout@v5


      # ----------------------------------------------------------
      # 2. Install Node.js
      # ----------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'


      # ----------------------------------------------------------
      # 3. Install project dependencies
      # ----------------------------------------------------------
      - name: Install npm dependencies
        run: npm ci


      # ----------------------------------------------------------
      # 4. Verify the committed .env contains the Firebase
      # web config. These values are public by design (browsers
      # receive them anyway); the database is protected by the
      # Realtime Database rules, not by hiding the API key.
      # ----------------------------------------------------------
      - name: Verify Firebase config
        run: |
          if [ ! -f .env ]; then
            echo "::error::Missing .env. The Firebase web config must live in the committed .env file."
            exit 1
          fi
          if ! grep -q '^VITE_FIREBASE_API_KEY=.' .env; then
            echo "::error::VITE_FIREBASE_API_KEY is missing or empty in .env."
            exit 1
          fi
          if ! grep -q '^VITE_FIREBASE_DATABASE_URL=.' .env; then
            echo "::error::VITE_FIREBASE_DATABASE_URL is missing or empty in .env."
            exit 1
          fi
          echo "Firebase config OK"


      # ----------------------------------------------------------
      # 5. Build Ionic/Vue application
      # ----------------------------------------------------------
      - name: Build Ionic application
        run: npm run build


      # ----------------------------------------------------------
      # 6. Install Java 21
      # IMPORTANT:
      # Capacitor Android currently compiles with Java 21.
      # ----------------------------------------------------------
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'


      # ----------------------------------------------------------
      # 7. Confirm Java version
      # ----------------------------------------------------------
      - name: Check Java version
        run: |
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"


      # ----------------------------------------------------------
      # 8. Ensure the Android platform exists
      # ----------------------------------------------------------
      - name: Ensure Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi


      # ----------------------------------------------------------
      # 9. Synchronize Capacitor with Android
      # ----------------------------------------------------------
      - name: Sync Capacitor Android
        run: npx cap sync android


      # ----------------------------------------------------------
      # 10. Give Gradle execution permission
      # ----------------------------------------------------------
      - name: Make Gradle executable
        run: chmod +x android/gradlew


      # ----------------------------------------------------------
      # 11. Check Gradle environment
      # ----------------------------------------------------------
      - name: Check Gradle version
        working-directory: android
        run: ./gradlew --version


      # ----------------------------------------------------------
      # 12. Build debug APK
      # ----------------------------------------------------------
      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug


      # ----------------------------------------------------------
      # 13. Rename the generated APK
      # ----------------------------------------------------------
      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk EventPlanner.apk


      # ----------------------------------------------------------
      # 14. Upload APK to GitHub Actions
      # ----------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: EventPlanner-APK
          path: EventPlanner.apk
          if-no-files-found: error
          retention-days: 30