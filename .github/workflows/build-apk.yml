name: Build Ionic Android APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build-apk:

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # 1. Get the source code
      # ----------------------------------------------------------
      - name: Checkout project
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # 2. Install Node.js
      # ----------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'


      # ----------------------------------------------------------
      # 3. Install project dependencies
      # ----------------------------------------------------------
      - name: Install npm dependencies
        run: npm ci


      # ----------------------------------------------------------
      # 4. Inject Firebase credentials from GitHub secrets
      # Add these secrets in: Repo > Settings > Secrets and
      # variables > Actions (values from Firebase console >
      # Project settings > Your apps > SDK setup and configuration):
      #   FIREBASE_API_KEY
      #   FIREBASE_AUTH_DOMAIN
      #   FIREBASE_DATABASE_URL
      #   FIREBASE_PROJECT_ID
      #   FIREBASE_STORAGE_BUCKET
      #   FIREBASE_MESSAGING_SENDER_ID
      #   FIREBASE_APP_ID
      # Quoted heredoc prevents bash expansion of secret values.
      # ----------------------------------------------------------
      - name: Configure Firebase credentials
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          if [ -z "$FIREBASE_API_KEY" ] || [ -z "$FIREBASE_DATABASE_URL" ]; then
            echo "::error::Firebase secrets are not configured. Add the 7 FIREBASE_* secrets under Settings > Secrets and variables > Actions (values from Firebase console > Project settings > Your apps)."
            exit 1
          fi
          cat > .env <<'EOF'
          VITE_FIREBASE_API_KEY=$FIREBASE_API_KEY
          VITE_FIREBASE_AUTH_DOMAIN=$FIREBASE_AUTH_DOMAIN
          VITE_FIREBASE_DATABASE_URL=$FIREBASE_DATABASE_URL
          VITE_FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID
          VITE_FIREBASE_STORAGE_BUCKET=$FIREBASE_STORAGE_BUCKET
          VITE_FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID
          VITE_FIREBASE_APP_ID=$FIREBASE_APP_ID
          EOF


      # ----------------------------------------------------------
      # 5. Build Ionic/Vue application
      # ----------------------------------------------------------
      - name: Build Ionic application
        run: npm run build


      # ----------------------------------------------------------
      # 6. Install Java 21
      # IMPORTANT:
      # Capacitor Android currently compiles with Java 21.
      # ----------------------------------------------------------
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'


      # ----------------------------------------------------------
      # 7. Confirm Java version
      # ----------------------------------------------------------
      - name: Check Java version
        run: |
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"


      # ----------------------------------------------------------
      # 8. Ensure the Android platform exists
      # ----------------------------------------------------------
      - name: Ensure Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi


      # ----------------------------------------------------------
      # 9. Synchronize Capacitor with Android
      # ----------------------------------------------------------
      - name: Sync Capacitor Android
        run: npx cap sync android


      # ----------------------------------------------------------
      # 10. Give Gradle execution permission
      # ----------------------------------------------------------
      - name: Make Gradle executable
        run: chmod +x android/gradlew


      # ----------------------------------------------------------
      # 11. Check Gradle environment
      # ----------------------------------------------------------
      - name: Check Gradle version
        working-directory: android
        run: ./gradlew --version


      # ----------------------------------------------------------
      # 12. Build debug APK
      # ----------------------------------------------------------
      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug


      # ----------------------------------------------------------
      # 13. Rename the generated APK
      # ----------------------------------------------------------
      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk EventPlanner.apk


      # ----------------------------------------------------------
      # 14. Upload APK to GitHub Actions
      # ----------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EventPlanner-APK
          path: EventPlanner.apk
          if-no-files-found: error
          retention-days: 30